version: '3.8'

services:
  naditwin-demo:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/meta')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s